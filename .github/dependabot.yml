version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 10
    labels: [dependencies, python]
    groups:
      pip-security:
        patterns: ["*"]
        update-types: [security]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 10
    labels: [dependencies, javascript]
    groups:
      npm-security:
        patterns: ["*"]
        update-types: [security]
