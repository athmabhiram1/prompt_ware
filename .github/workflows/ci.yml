name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt ruff pytest pytest-cov
      - name: ruff check (F1 error-level gate, see pyproject.toml)
        working-directory: ./backend
        run: ruff check .
      - name: "ruff format (F1 scope: app tree + tests)"
        working-directory: ./backend
        run: ruff format --check app/core app/engine app/rag app/routers smoke_test.py tests/
      - name: pytest with coverage gate (80% branch, fail_under in pyproject.toml)
        working-directory: ./backend
        run: pytest --cov --cov-branch -q
      - name: pip-audit (supply-chain, --strict)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --strict --requirement backend/requirements.txt 2>&1 | tee pip-audit.log
      - name: upload pip-audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-log
          path: pip-audit.log

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: ./frontend
        run: npm ci
      - working-directory: ./frontend
        run: npm run lint
      - working-directory: ./frontend
        run: npx tsc -b
      - working-directory: ./frontend
        run: npx vitest run --coverage --reporter=minimal
      - name: a11y gate (vitest-axe smoke, wcag2a/wcag2aa; no browsers in CI)
        working-directory: ./frontend
        run: npx vitest run tests/a11y.spec.ts --reporter=minimal
      - name: npm audit (supply-chain, high+)
        working-directory: ./frontend
        continue-on-error: true
        run: npm audit --audit-level=high 2>&1 | tee ../npm-audit.log
      - name: upload npm-audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-log
          path: npm-audit.log

  diet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: trufflehog filesystem scan (re-checks W1.1; base-independent so push-to-main passes)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified
      - name: repo diet readout
        run: |
          du -sh .
          git count-objects -vH
      - name: PNG guard (verifies W1.2 — fail on NEW *.png under public/)
        run: |
          base=$(git merge-base origin/main HEAD 2>/dev/null || git rev-list --max-parents=0 HEAD)
          new_pngs=$(git diff --name-only --diff-filter=A "$base" HEAD -- 'frontend/public/*.png' 'public/*.png' || true)
          if [ -n "$new_pngs" ]; then echo "NEW PNGs under public/ — use WebP (see W1.2):"; echo "$new_pngs"; exit 1; fi
          echo "png-guard ok (legacy background-clean.png grandfathered; W1.2 tracks removal)"
